openapi: 3.0.3
info:
  title: AirEye API
  description: |
    HTTP API for the AirEye backend: capture a document image, run a prompt-configured workflow, and return normalized output.

    | Area | Base path |
    |------|-----------|
    | Health | `GET /api/v1/health` |
    | Import | `POST /api/v1/import` - `multipart/form-data`, required file field `image` (`text/event-stream`) |
    | Regenerate | `POST /api/v1/regenerate` - JSON body for rerunning an existing export row (`text/event-stream`) |
    | Send notification | `POST /api/v1/send-notification` |
    | Export | `GET /api/v1/export` |
    | Provider | `GET /api/v1/provider`, `PUT /api/v1/provider` |
    | Auto analyse flag | `PUT /api/v1/auto-analyse` |

    Prompt text is loaded from Langfuse. The configured tool-reasoning prompt returns ordered workflow steps; each step references another Langfuse prompt and selects either a vision step or reasoning step. Import and regenerate stream the running workflow step, each step output, then a terminal export row or error object.

    FCM topic messages use `AIREYE_FCM_TOPIC`, or the AirEye default `aireye_new_result` when the environment variable is unset.

    With the backend running, open `/docs` on the same origin for the embedded Scalar API Reference, or import this file's URL elsewhere.
  version: 0.2.12

security:
  - ApiKeyAuth: []

servers:
  - url: /
    description: Local backend origin during development

tags:
  - name: health
    description: Firebase, LiteLLM, and S3 readiness
  - name: import
    description: Photo capture upload that streams a prompt-configured document image workflow
  - name: regenerate
    description: Rerun the prompt-configured workflow for an existing export row
  - name: send-notification
    description: Receiver-triggered silent FCM topic request for sender devices to capture a photo
  - name: export
    description: Paginated newest-first export rows from Realtime Database
  - name: provider
    description: Runtime LLM provider state stored in Firebase Realtime Database under `provider_state/current_provide`
  - name: auto-analyse
    description: Runtime import workflow gate stored in Firebase Realtime Database under `auto_analyse`

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Integration health
      description: |
        Checks Firebase Realtime Database, LiteLLM model discovery, and S3 bucket readiness.
      operationId: getHealth
      responses:
        "200":
          description: All integration checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationHealthReport"
              example:
                version: 0.2.12
                ok: true
                firebase:
                  ok: true
                  latencyMs: 24
                llm:
                  ok: true
                  latencyMs: 156
                s3:
                  ok: true
                  latencyMs: 89
        "503":
          description: One or more checks failed; body still returns the full report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationHealthReport"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/import:
    post:
      tags: [import]
      summary: Import document image
      description: |
        Accepts a single photo capture as `multipart/form-data` with one required file part named `image`.

        The server reads `{development|production}/auto_analyse` from Firebase before starting work. Missing `auto_analyse` defaults to `true`.

        When `auto_analyse` is `true`, the server stores the image in S3/MinIO, writes a pending Realtime Database row, sends a receiver export refresh hint, runs the Langfuse/LiteLLM workflow, updates the same row with normalized output, then sends another export refresh hint.

        When `auto_analyse` is `false`, the server stores the image only, writes the pending row with image storage fields, sends one receiver export refresh hint, emits that image-only terminal row, and skips provider lookup, tool reasoning, and workflow execution.

        Each workflow step is prompt-configured through Langfuse. A vision step receives the image URL and prompt text. A reasoning step receives the previous step output and prompt text. The first step output becomes `extractedText`; the final step output becomes `finalText`.

        The response is Server-Sent Events. Each event is one `data:` line containing JSON:

        1. `{"status":"running_step","data":{"index":0,"prompt":"...","model":"image"}}`
        2. `{"data":{"stepIndex":0,"output":"..."}}`
        3. Additional running/output pairs for later workflow steps
        4. A terminal export row with `id`, timestamps, image storage fields, and, when auto analyse ran, `extractedText` and `finalText`
        5. Or a terminal `{"error":{"code":"...","message":"..."}}`

        Topic resolution for sender capture requests and receiver import refresh messages is `AIREYE_FCM_TOPIC`, then the AirEye default `aireye_new_result`.
      operationId: postImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Binary document image. Use one image MIME type per file part.
      responses:
        "200":
          description: SSE stream containing workflow step events and the terminal result
          headers:
            Cache-Control:
              description: Clients must not cache the live stream as a static document.
              schema:
                type: string
                example: no-cache
            Connection:
              description: Keep the TCP connection open for the duration of the stream.
              schema:
                type: string
                example: keep-alive
            X-Accel-Buffering:
              description: Hint for nginx to disable response buffering so chunks flush promptly.
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: UTF-8 Server-Sent Events body. Split on blank lines; each `data:` line carries one JSON value.
              example: |
                data: {"status":"running_step","data":{"index":0,"prompt":"extract-document-fields","model":"image"}}

                data: {"data":{"stepIndex":0,"output":"{\"fields\":[{\"label\":\"total\",\"value\":\"42.10\"}]}"}}

                data: {"status":"running_step","data":{"index":1,"prompt":"format-export-row","model":"reasoning"}}

                data: {"data":{"stepIndex":1,"output":"<section><h2>Summary</h2><p>Total: 42.10</p></section>"}}

                data: {"id":"upl_abc","createdAt":1745000001000,"updatedAt":1745000001500,"extractedText":"{\"fields\":[{\"label\":\"total\",\"value\":\"42.10\"}]}","finalText":"<section><h2>Summary</h2><p>Total: 42.10</p></section>","imageUrl":"https://minio.example.test/document-images/uploads/upl_abc-a1b2c3d4.jpg","bucket":"document-images","objectKey":"uploads/upl_abc-a1b2c3d4.jpg"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/regenerate:
    post:
      tags: [regenerate]
      summary: Regenerate existing export row
      description: |
        Reruns the same prompt-configured workflow for an existing upload row without uploading image bytes again.

        The server extracts the upload id from the image object filename, loads the existing row, clears stale output fields, streams workflow step events, and updates the same row with the new normalized output.

        Regenerate does not read the `auto_analyse` flag; it always runs the Langfuse/LiteLLM workflow.
      operationId: postRegenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRequest"
            example:
              imageUrl: https://minio.example.test/document-images/uploads/upl_abc-a1b2c3d4.jpg
              text: "<section><h2>Summary</h2><p>Total: 42.10</p></section>"
      responses:
        "200":
          description: SSE stream containing workflow step events and the terminal result
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"status":"running_step","data":{"index":0,"prompt":"extract-document-fields","model":"image"}}

                data: {"data":{"stepIndex":0,"output":"normalized fields"}}

                data: {"id":"upl_abc","createdAt":1745000001000,"updatedAt":1745000002500,"extractedText":"normalized fields","finalText":"formatted result","imageUrl":"https://minio.example.test/document-images/uploads/upl_abc-a1b2c3d4.jpg","bucket":"document-images","objectKey":"uploads/upl_abc-a1b2c3d4.jpg"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auto-analyse:
    put:
      tags: [auto-analyse]
      summary: Set auto_analyse import workflow flag
      description: |
        Stores the boolean import workflow gate at `{development|production}/auto_analyse` in Firebase Realtime Database.

        When the flag is `true` or missing, imports run the full Langfuse/LiteLLM workflow. When the flag is `false`, imports upload the image, create the image-only export row, broadcast one export refresh, and skip all provider and workflow calls. Regenerate ignores this flag and always runs the workflow.
      operationId: putAutoAnalyse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoAnalyseUpdateRequest"
            example:
              auto_analyse: true
      responses:
        "200":
          description: auto_analyse flag after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAnalyseState"
              example:
                auto_analyse: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/send-notification:
    post:
      tags: [send-notification]
      summary: Send notification
      description: |
        Sends a silent FCM topic data message through the configured AirEye notifier. The payload is targeted at sender devices: `kind: capture_request`, `notificationType: silent`, `notification_type: silent`, `role: sender`, and `targetRole: sender`.

        The response is returned after Firebase accepts the send request.
      operationId: postSendNotification
      responses:
        "200":
          description: Silent FCM sender notification accepted by Firebase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNotificationResponse"
              example:
                ok: true
        "500":
          $ref: "#/components/responses/InternalError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/export:
    get:
      tags: [export]
      summary: Export rows
      description: |
        Returns paginated, newest-first export rows from Realtime Database.

        Pending rows can include `imageUrl`; completed rows add `finalText`; failed rows add `errorMessage`.
      operationId: getExport
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated export rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportListResponse"
              example:
                page: 1
                limit: 20
                is_next: false
                data:
                  - createdAt: 1745000002000
                    updatedAt: 1745000002100
                    imageUrl: https://minio.example.test/document-images/uploads/upl_pending-a1b2c3d4.jpg
                  - createdAt: 1745000001000
                    updatedAt: 1745000001500
                    finalText: "<section><h2>Summary</h2><p>Total: 42.10</p></section>"
                    imageUrl: https://minio.example.test/document-images/uploads/upl_abc-a1b2c3d4.jpg
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/provider:
    get:
      tags: [provider]
      summary: Get active LLM provider
      description: |
        Returns the active LLM provider stored in Firebase Realtime Database plus providers dynamically discovered from LiteLLM model routes. A provider is available only when both `<provider>-image` and `<provider>-reasoning` exist.
      operationId: getProvider
      responses:
        "200":
          description: Current provider state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderState"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [provider]
      summary: Switch active LLM provider
      description: |
        Stores the selected base provider in Firebase Realtime Database at `provider_state/current_provide`. Subsequent workflow calls use `<provider>-image` for vision steps and `<provider>-reasoning` for reasoning steps.
      operationId: putProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdateRequest"
      responses:
        "200":
          description: Provider state after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page index. Omitted means 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size from 1 to 50. Omitted means 20.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
        example: 20

  responses:
    BadRequest:
      description: Missing or invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: INVALID_REQUEST
              message: image is required
    PayloadTooLarge:
      description: Image larger than 500 MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: IMAGE_TOO_LARGE
              message: image exceeds the 500 MB limit
    UnsupportedMediaType:
      description: Rejected file type or MIME
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: UNSUPPORTED_FILE_TYPE
              message: Only image uploads are supported
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid API key
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
    ServiceUnavailable:
      description: Storage or upstream dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: PROVIDER_NOT_CONFIGURED
              message: Current provider is not configured
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: NOT_FOUND
              message: upload not found

  schemas:
    DependencyCheck:
      type: object
      required: [ok, latencyMs]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int32
          minimum: 0
        error:
          type: string

    IntegrationHealthReport:
      type: object
      required: [version, ok, firebase, llm, s3]
      properties:
        version:
          type: string
          description: Backend application version from `backend/package.json`
          example: 0.2.12
        ok:
          type: boolean
        firebase:
          $ref: "#/components/schemas/DependencyCheck"
        llm:
          $ref: "#/components/schemas/DependencyCheck"
        s3:
          $ref: "#/components/schemas/DependencyCheck"

    ImportStreamRunningStep:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [running_step]
        data:
          type: object
          required: [index, prompt, model]
          properties:
            index:
              type: integer
              minimum: 0
            prompt:
              type: string
              description: Langfuse prompt name for this workflow step
            model:
              type: string
              enum: [image, reasoning]

    ImportStreamStepOutput:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [stepIndex, output]
          properties:
            stepIndex:
              type: integer
              minimum: 0
            output:
              type: string

    ImportStreamResult:
      type: object
      required: [id, createdAt, updatedAt]
      description: Terminal event that mirrors the Realtime Database row under `uploads/{id}`.
      properties:
        id:
          type: string
          example: upl_8741170b50a14381a696e87f07dca6b5
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        extractedText:
          type: string
          description: First workflow step output
        finalText:
          type: string
          description: Final workflow step output; usually a formatted result
        imageUrl:
          type: string
          format: uri
        bucket:
          type: string
        objectKey:
          type: string

    ImportStreamTerminalError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    ImportStreamSseData:
      oneOf:
        - $ref: "#/components/schemas/ImportStreamRunningStep"
        - $ref: "#/components/schemas/ImportStreamStepOutput"
        - $ref: "#/components/schemas/ImportStreamResult"
        - $ref: "#/components/schemas/ImportStreamTerminalError"

    RegenerateRequest:
      type: object
      required: [imageUrl, text]
      properties:
        imageUrl:
          type: string
          format: uri
          description: Current image URL from the export row. The object filename must begin with the upload key, such as `upl_abc-1234.jpg`.
        text:
          type: string
          description: Current displayed formatted result; may be empty.

    SendNotificationResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    LlmProvider:
      type: string
      description: Base provider name discovered from LiteLLM routes that have both `<provider>-image` and `<provider>-reasoning`.

    ProviderState:
      type: object
      required: [current_provide, available_providers]
      properties:
        current_provide:
          $ref: "#/components/schemas/LlmProvider"
        available_providers:
          type: array
          items:
            $ref: "#/components/schemas/LlmProvider"

    ProviderUpdateRequest:
      type: object
      required: [current_provide]
      properties:
        current_provide:
          $ref: "#/components/schemas/LlmProvider"

    AutoAnalyseState:
      type: object
      required: [auto_analyse]
      properties:
        auto_analyse:
          type: boolean

    AutoAnalyseUpdateRequest:
      type: object
      required: [auto_analyse]
      properties:
        auto_analyse:
          type: boolean

    ExportListResponse:
      type: object
      required: [data, page, limit, is_next]
      properties:
        data:
          type: array
          description: Newest-first by `createdAt`
          items:
            $ref: "#/components/schemas/ExportListItem"
          default: []
        page:
          type: integer
          format: int32
          minimum: 1
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        is_next:
          type: boolean

    ExportListItem:
      type: object
      required: [createdAt]
      properties:
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        finalText:
          type: string
          description: Present when the workflow completed successfully
        imageUrl:
          type: string
          format: uri
        errorMessage:
          type: string

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: image is required
