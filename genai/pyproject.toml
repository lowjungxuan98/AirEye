[project]
name = "aireye-genai"
version = "0.1.0"
description = "AirEye GenAI service: LangGraph orchestration + LangChain + LlamaIndex RAG, traced by Langfuse, routed through LiteLLM."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=11",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.4",
    "llama-index-core>=0.11",
    "llama-index-vector-stores-qdrant>=0.3",
    "llama-index-embeddings-openai>=0.2",
    "langfuse>=3,<4",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
