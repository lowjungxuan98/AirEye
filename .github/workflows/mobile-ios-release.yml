name: Mobile iOS Release

on:
  pull_request:
    paths:
      - "mobile/**"
      - "docs/mobile/**"
      - ".github/workflows/mobile-ios-release.yml"
      - ".github/workflows/mobile-firebase-app-distribution.yml"
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    outputs:
      mobile_changed: ${{ steps.mobile_changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect mobile changes for tag release
        id: mobile_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag="$(git tag --list 'mobile-v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          if [[ -z "$previous_tag" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$previous_tag" HEAD -- mobile docs/mobile .github/workflows/mobile-ios-release.yml .github/workflows/mobile-firebase-app-distribution.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.mobile_changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        if: steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile
        run: flutter analyze lib packages

      - name: Validate iOS release secrets
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        env:
          AIREYE_API_BASE_URL: ${{ secrets.AIREYE_API_BASE_URL }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AIREYE_API_BASE_URL FIREBASE_IOS_API_KEY FIREBASE_IOS_APP_ID FIREBASE_IOS_BUNDLE_ID FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_DATABASE_URL FIREBASE_STORAGE_BUCKET FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Install signing cert and provisioning profile
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/AirEye_AdHoc.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/AirEye_AdHoc.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/aireye-build.keychain-db"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          if [[ ! -s "$CERT_PATH" || ! -s "$PROFILE_PATH" ]]; then
            echo "Decoded iOS signing assets are empty."
            exit 1
          fi

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" || true
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "Apple Distribution signing identity was not imported into the temporary keychain."
            exit 1
          fi
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          echo "Installing provisioning profile '$PROFILE_NAME' ($PROFILE_UUID) for $PROFILE_APP_ID"
          PROFILE_DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DEST"
          cp "$PROFILE_PATH" "$PROFILE_DEST/$PROFILE_UUID.mobileprovision"

      - name: Switch to manual code signing for CI
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          PBXPROJ="Runner.xcodeproj/project.pbxproj"
          # Runner Release config
          sed -i '' -e '/97C147071CF9000F007C117D/,/^[[:space:]]*};/{
            s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/
            s/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/
            s/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "AirEye Ad-Hoc";/
          }' "$PBXPROJ"
          # Runner Profile config
          sed -i '' -e '/249021D4217E4FDB00AE95B9/,/^[[:space:]]*};/{
            s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/
            s/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/
            s/PROVISIONING_PROFILE_SPECIFIER = "";/PROVISIONING_PROFILE_SPECIFIER = "AirEye Ad-Hoc";/
          }' "$PBXPROJ"

      - name: Install CocoaPods
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Generate iOS Firebase config
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile
        env:
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          cat > ios/Runner/GoogleService-Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>$FIREBASE_IOS_API_KEY</string>
            <key>GOOGLE_APP_ID</key>
            <string>$FIREBASE_IOS_APP_ID</string>
            <key>GCM_SENDER_ID</key>
            <string>$FIREBASE_MESSAGING_SENDER_ID</string>
            <key>PROJECT_ID</key>
            <string>$FIREBASE_PROJECT_ID</string>
            <key>BUNDLE_ID</key>
            <string>$FIREBASE_IOS_BUNDLE_ID</string>
            <key>DATABASE_URL</key>
            <string>$FIREBASE_DATABASE_URL</string>
            <key>STORAGE_BUCKET</key>
            <string>$FIREBASE_STORAGE_BUCKET</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Build release IPA
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile
        env:
          AIREYE_API_BASE_URL: ${{ secrets.AIREYE_API_BASE_URL }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=AIREYE_API_BASE_URL="$AIREYE_API_BASE_URL" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"

      - name: Upload iOS dSYMs to Crashlytics
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          firebase_ios_sdk_version="$(sed -nE 's/^[[:space:]]*-[[:space:]]FirebaseCrashlytics[[:space:]]+\(([0-9.]+)\).*/\1/p' ios/Podfile.lock | head -n 1)"
          if [[ -z "$firebase_ios_sdk_version" ]]; then
            echo "Could not determine FirebaseCrashlytics version from ios/Podfile.lock."
            exit 1
          fi

          upload_symbols="$RUNNER_TEMP/firebase-crashlytics-upload-symbols"
          curl --fail --location --silent --show-error \
            --output "$upload_symbols" \
            "https://raw.githubusercontent.com/firebase/firebase-ios-sdk/CocoaPods-${firebase_ios_sdk_version}/Crashlytics/upload-symbols"
          chmod +x "$upload_symbols"

          dsym_dir="build/ios/archive/Runner.xcarchive/dSYMs"
          if [[ ! -d "$dsym_dir" ]]; then
            echo "Expected dSYM directory not found: $dsym_dir"
            exit 1
          fi

          "$upload_symbols" -gsp ios/Runner/GoogleService-Info.plist -p ios "$dsym_dir"

      - name: Upload IPA artifact
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aireye-ios-ipa
          path: mobile/build/ios/ipa/AirEye.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Show iOS build folder on failure
        if: failure() && github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        working-directory: mobile
        shell: bash
        run: |
          set +e
          if [[ ! -d build ]]; then
            echo "No build directory found in $(pwd)."
            ls -la
            exit 0
          fi

          if ! command -v tree >/dev/null 2>&1; then
            brew install tree
          fi
          tree -a build

      - name: Cleanup keychain
        if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/aireye-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/AirEye_AdHoc.mobileprovision"

      - name: Skip release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && steps.mobile_changes.outputs.changed == 'false'
        run: echo "No mobile changes detected since the previous mobile-v* tag; iOS release skipped."

  ios-distribute:
    needs: ios
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v') && needs.ios.outputs.mobile_changed == 'true'
    uses: ./.github/workflows/mobile-firebase-app-distribution.yml
    with:
      artifact-name: aireye-ios-ipa
      file-name: AirEye.ipa
      release-notes: "AirEye mobile ${{ github.ref_name }}"
    secrets:
      firebase_app_id: ${{ secrets.FIREBASE_IOS_APP_ID }}
      firebase_service_account: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
